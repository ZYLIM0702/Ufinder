<text x="623" y="460" font-size="16" font-weight="600" fill="#c3cfe6" text-anchor="middle">Only the top of</text><text x="623" y="482" font-size="16" font-weight="600" fill="#c3cfe6" text-anchor="middle">each list votes</text>
