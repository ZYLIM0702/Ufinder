<text x="836" y="448" font-size="18" font-weight="500" fill="#c3cfe6" text-anchor="start">“Hawker lunch at Gurney Drive”</text>
<text x="836" y="508" font-size="21" font-weight="700" fill="#ffffff" text-anchor="start">Keyword and vectors alone stop here.</text>
<text x="836" y="540" font-size="19" font-weight="500" fill="#c3cfe6" text-anchor="start">They cannot see the photos: no words, nothing to match.</text>
