<text x="882" y="290" font-size="22" font-weight="700" fill="#e8eefb" text-anchor="start">voice-note-day2.m4a</text>
<rect x="1270" y="266" width="140" height="34" rx="17" fill="#ffc24a" fill-opacity=".2"/><text x="1340" y="289" font-size="16" font-weight="700" fill="#ffc24a" text-anchor="middle">Said aloud</text>
<text x="836" y="332" font-size="18" font-weight="500" fill="#c3cfe6" text-anchor="start">“...we had char kway teow at Gurney Drive...”</text>
