<use xlink:href="#i-doc" x="836" y="382" width="32" height="32" fill="none" stroke="#62b0ff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="406" font-size="22" font-weight="700" fill="#e8eefb" text-anchor="start">itinerary.md</text>
