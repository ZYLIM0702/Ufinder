<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1500" height="1000" viewBox="0 0 1500 1000" font-family="Avenir Next, Helvetica Neue, Helvetica, Arial, sans-serif">
<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#090f22"/><stop offset="1" stop-color="#141a3c"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#19e3a1"/><stop offset="1" stop-color="#5aa2ff"/></linearGradient>
    <linearGradient id="gTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2bf0ad"/><stop offset="1" stop-color="#0db8c8"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#62b0ff"/><stop offset="1" stop-color="#6a63ff"/></linearGradient>
    <linearGradient id="gViolet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b57bff"/><stop offset="1" stop-color="#ff5fa2"/></linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffdf6e"/><stop offset="1" stop-color="#ff9a3d"/></linearGradient>
    <linearGradient id="gCoral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a7a"/><stop offset="1" stop-color="#ff4f9a"/></linearGradient>
    <linearGradient id="gGate" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f7dff"/><stop offset="0.55" stop-color="#8a5cff"/><stop offset="1" stop-color="#e255c0"/></linearGradient>
    <linearGradient id="gFolder" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffd35c"/><stop offset="1" stop-color="#ffa23f"/></linearGradient>
    <linearGradient id="skillFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f3a3f"/><stop offset="1" stop-color="#0d2230"/></linearGradient>
    <linearGradient id="engFill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2558"/><stop offset="1" stop-color="#231c52"/></linearGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46536f"/><stop offset="1" stop-color="#262f47"/></linearGradient>
    <linearGradient id="tray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141b30"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <radialGradient id="glowT"><stop offset="0" stop-color="#19e3a1" stop-opacity=".30"/><stop offset="1" stop-color="#19e3a1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowV"><stop offset="0" stop-color="#8a5cff" stop-opacity=".38"/><stop offset="1" stop-color="#8a5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowA"><stop offset="0" stop-color="#ffb347" stop-opacity=".22"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity=".07"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="led" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dy="8"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8eefb"/></marker>
    <marker id="ahA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#ffc24a"/></marker>

    <!-- icons: 24 grid, stroke inherited -->
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.1-4.7A8.5 8.5 0 1 1 21 12z"/><path d="M8.5 12h.01M12.5 12h.01M16.5 12h.01" stroke-width="3"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><path d="M2.5 9h19"/><circle cx="11" cy="14.2" r="2.4"/><path d="M12.8 16l2.2 2"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4.5" y="8.5" width="15" height="11.5" rx="3"/><path d="M12 8.5V4.5"/><circle cx="12" cy="3.4" r="1.2"/><path d="M9 13.2h.01M15 13.2h.01" stroke-width="3"/><path d="M9.5 16.8h5M2 13v3.5M22 13v3.5"/></symbol>
    <symbol id="i-graph" viewBox="0 0 24 24"><path d="M6.5 6.5L12 13l6.5-6.5M12 13l-6 6M12 13l7 5.5"/><circle cx="5.5" cy="5.5" r="2.6" /><circle cx="18.5" cy="5.5" r="2.6"/><circle cx="12" cy="13" r="2.8"/><circle cx="5" cy="19.5" r="2.2"/><circle cx="19.5" cy="19" r="2.2"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 2.5h8.5L19 7v14.5H6z"/><path d="M14.5 2.5V7H19M9 12h7M9 16h7"/></symbol>
    <symbol id="i-photo" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><circle cx="8.2" cy="9.7" r="1.7"/><path d="M21.5 15.5l-5-5L6.5 19.5"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4.5 19.5V5a2.5 2.5 0 0 1 2.5-2.5h12.5v15H7a2.5 2.5 0 0 0-2.5 2.5zM4.5 19.5a2 2 0 0 0 2 2h13"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M10 8.2l6 3.8-6 3.8z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M2.5 7a2 2 0 0 1 2-2h4.8l2.2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.5l8 3v6.5c0 5-3.4 8-8 9.5-4.6-1.5-8-4.5-8-9.5V5.5z"/><path d="M8.5 12l2.5 2.5 4.5-4.5"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10.5" width="15" height="11" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3M12 15v2.5"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15.5" r="5"/><path d="M11.6 12L20.5 3M16.5 7l3.2 3.2M13.8 9.8l2 2"/></symbol>
    <symbol id="i-nocloud" viewBox="0 0 24 24"><path d="M7 19h10.5a4.5 4.5 0 0 0 .8-8.9A6.5 6.5 0 0 0 5.8 8.9 5 5 0 0 0 7 19z"/><path d="M3.5 3.5l17 17" stroke-width="2.6"/></symbol>
    <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19h10.500a4.500 4.500 0 0 0 .8-8.900A6.500 6.500 0 0 0 5.800 8.900 5 5 0 0 0 7 19z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5"/><path d="M3.5 21.5c1.4-4.6 4.8-7 8.5-7s7.100 2.400 8.500 7"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M1.500 12S5.500 4.800 12 4.800 22.500 12 22.500 12 18.500 19.200 12 19.200 1.500 12 1.500 12z"/><circle cx="12" cy="12" r="3.200"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="9.800" y="9.800" width="4.400" height="4.400" rx=".8"/><path d="M9.500 2.500V6M14.500 2.500V6M9.500 18v3.500M14.500 18v3.500M2.500 9.500H6M2.500 14.500H6M18 9.500h3.500M18 14.500h3.500"/></symbol>
    <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.500" rx="8.500" ry="3"/><path d="M3.500 5.500v13c0 1.700 3.800 3 8.500 3s8.500-1.300 8.500-3v-13M3.500 12c0 1.700 3.800 3 8.500 3s8.500-1.300 8.500-3"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="8.500" y="2.500" width="7" height="12" rx="3.500"/><path d="M4.500 11.500a7.500 7.500 0 0 0 15 0M12 19v2.500"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.500" y="5.500" width="14" height="13" rx="2.500"/><path d="M16.500 10.500l5-3v9l-5-3z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.500 12.500l5 5 10-11"/></symbol>
