<rect width="1500" height="1000" fill="url(#bg)"/><rect width="1500" height="1000" fill="url(#dots)"/>
<ellipse cx="1100" cy="240" rx="560" ry="300" fill="url(#glowT)"/><ellipse cx="300" cy="800" rx="520" ry="340" fill="url(#glowV)"/>
<text x="48" y="86" font-size="54" font-weight="800" fill="#e8eefb" text-anchor="start">Enforced below the LLM</text>
<text x="50" y="126" font-size="24" font-weight="500" fill="#d6dff0" text-anchor="start">Every check runs against the live Docker stack. Nothing is mocked.</text>
<text x="1452" y="92" font-size="66" font-weight="800" fill="url(#title)" text-anchor="end">85 / 85</text>
<text x="1452" y="126" font-size="22" font-weight="600" fill="#d6dff0" text-anchor="end">checks passed</text>
<rect x="48" y="152" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="102" cy="205.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-user" x="82" y="185" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="196" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">User segregation</text><text x="148" y="228" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">One user never sees another's files, topics or counts</text>
<text x="714" y="214" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">19/19</text>
<rect x="762" y="152" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="816" cy="205.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-nocloud" x="796" y="185" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="196" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">No route out</text><text x="862" y="228" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Nothing that touches data can reach the internet</text>
<text x="1428" y="214" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">10/10</text>
<rect x="48" y="269" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="102" cy="322.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-lock" x="82" y="302" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="313" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Least privilege</text><text x="148" y="345" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Non-root, zero capabilities, in every container</text>
<text x="714" y="331" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">5/5</text>
<rect x="762" y="269" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="816" cy="322.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-folder" x="796" y="302" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="313" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Read-only files</text><text x="862" y="345" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">The engine cannot change a user file</text>
<text x="1428" y="331" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">3/3</text>
<rect x="48" y="386" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="102" cy="439.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-key" x="82" y="419" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="430" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Key limits</text><text x="148" y="462" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Scope, budget, revocation, hashed storage</text>
<text x="714" y="448" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">7/7</text>
<rect x="762" y="386" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="816" cy="439.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-shield" x="796" y="419" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="430" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Content tiers</text><text x="862" y="462" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">External keys get paths. Snippets are redacted</text>
<text x="1428" y="448" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">3/3</text>
<rect x="48" y="503" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="102" cy="556.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-doc" x="82" y="536" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="547" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Prompt injection</text><text x="148" y="579" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Hostile files stay data. No send or delete tool</text>
<text x="714" y="565" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">3/3</text>
<rect x="762" y="503" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="816" cy="556.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-lock" x="796" y="536" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="547" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Credential files</text><text x="862" y="579" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Keys and env files are never indexed</text>
<text x="1428" y="565" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">4/4</text>
<rect x="48" y="620" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="102" cy="673.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-doc" x="82" y="653" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="664" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Audit chain</text><text x="148" y="696" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Editing history breaks the chain</text>
<text x="714" y="682" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">2/2</text>
<rect x="762" y="620" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="816" cy="673.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-eye" x="796" y="653" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="664" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Change tracking</text><text x="862" y="696" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Edits and deletes are purged, not hidden</text>
<text x="1428" y="682" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">8/8</text>
<rect x="48" y="737" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="102" cy="790.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-graph" x="82" y="770" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="781" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Missing files</text><text x="148" y="813" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Mentioned but absent, and resolves itself</text>
<text x="714" y="799" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">2/2</text>
<rect x="762" y="737" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="816" cy="790.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-folder" x="796" y="770" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="781" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Skill bridge</text><text x="862" y="813" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Plain files, per user, with no sockets</text>
<text x="1428" y="799" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">5/5</text>
<rect x="48" y="854" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="102" cy="907.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-cloud" x="82" y="887" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="148" y="898" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Frontier endpoint</text><text x="148" y="930" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Off by default. One host. Opted-in folders only</text>
<text x="714" y="916" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">10/10</text>
<rect x="762" y="854" width="690" height="106" rx="18" fill="#17214a" stroke="#ffffff" stroke-opacity=".14" stroke-width="2" filter="url(#shadow)"/>
<circle cx="816" cy="907.0" r="30" fill="url(#gTeal)" filter="url(#glow)"/><use xlink:href="#i-eye" x="796" y="887" width="40" height="40" fill="none" stroke="#0b1020" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="862" y="898" font-size="24" font-weight="800" fill="#e8eefb" text-anchor="start">Search features</text><text x="862" y="930" font-size="17" font-weight="500" fill="#c3cfe6" text-anchor="start">Chinese text, image query, operators, embeddings</text>
<text x="1428" y="916" font-size="30" font-weight="800" fill="#5ff5c6" text-anchor="end">4/4</text>
</svg>